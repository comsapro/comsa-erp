services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: comsa
      POSTGRES_PASSWORD: comsa
      POSTGRES_DB: comsa_e2e
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U comsa -d comsa_e2e"]
      interval: 2s
      timeout: 5s
      retries: 20
    tmpfs:
      - /var/lib/postgresql/data
